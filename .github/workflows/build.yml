name: Build and Release

on:
  push:
    branches: [main, "feat/windows-winui3"]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # No -p:Platform here: the solution maps "Any CPU" to x64 for the app
      # project, and passing an explicit platform fails with MSB4126 because
      # there is no x64 *solution* configuration.
      - name: Build
        working-directory: src-windows
        run: dotnet build CRT.sln -c Release

      - name: Test
        working-directory: src-windows
        run: dotnet test CRT.Core.Tests/CRT.Core.Tests.csproj -c Release --no-build

      # Self-contained and single-file: the Windows App SDK runtime ships with
      # the app, packed into the one executable (see CRT.csproj).
      # DebugType is passed here rather than left to the app's csproj so it
      # reaches the referenced projects too: setting it on CRT alone still let
      # CRT.Core drop its .pdb into the package.
      - name: Publish
        working-directory: src-windows
        run: dotnet publish CRT/CRT.csproj -c Release -r win-x64 --self-contained -p:DebugType=none -o publish

      # ffmpeg and yt-dlp are separate programs, so they cannot live inside the
      # single-file exe — they have to exist as files to be launched. They ship
      # in a tools folder beside it, which ToolLocator checks before offering to
      # download anything.
      #
      # The GPL build, matching what ToolLocator downloads when the tools are
      # absent. This is not a free choice: the exporter encodes with libx264,
      # which is GPL-licensed and therefore absent from the LGPL build — a
      # bundle built from that one cannot export at all. Shipping it is still
      # mere aggregation, since ffmpeg is only ever invoked as a subprocess.
      - name: Bundle ffmpeg and yt-dlp
        working-directory: src-windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/tools | Out-Null
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $ffmpegUrl -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-src
          foreach ($tool in "ffmpeg.exe", "ffprobe.exe") {
            $found = Get-ChildItem ffmpeg-src -Recurse -Filter $tool | Select-Object -First 1
            if (-not $found) { throw "$tool missing from the ffmpeg archive" }
            Copy-Item $found.FullName publish/tools/
          }
          $licence = Get-ChildItem ffmpeg-src -Recurse -Include "LICENSE*", "COPYING*" | Select-Object -First 1
          if ($licence) { Copy-Item $licence.FullName publish/tools/FFMPEG-LICENSE.txt }
          Invoke-WebRequest "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile publish/tools/yt-dlp.exe
          Remove-Item ffmpeg.zip, ffmpeg-src -Recurse -Force
          Copy-Item ../THIRD-PARTY.md publish/tools/THIRD-PARTY.md

      # Guards the regression that shipped in the previous build: the bundle was
      # switched to an ffmpeg variant that has no x264, so every export failed
      # with "unknown encoder" while CI stayed green. A build that cannot encode
      # should not reach anyone, so this proves it can before packaging.
      - name: Verify the bundled ffmpeg can encode
        working-directory: src-windows
        shell: pwsh
        run: |
          $ffmpeg = "publish/tools/ffmpeg.exe"
          $encoders = & $ffmpeg -hide_banner -encoders 2>&1 | Out-String
          if ($encoders -notmatch '\blibx264\b') {
            throw "The bundled ffmpeg has no libx264. The GPL build is required; the LGPL one omits it."
          }
          # Listing it is not the same as being able to use it, so encode.
          & $ffmpeg -hide_banner -loglevel error -y `
            -f lavfi -i "testsrc=size=320x180:duration=1:rate=10" `
            -vf "drawtext=fontfile='C\:/Windows/Fonts/consola.ttf':fontsize=20:fontcolor=0xFFFFFF:x=10:y=10:text='00\:00\:01.000'" `
            -c:v libx264 -preset veryfast -crf 18 smoke.mp4
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path smoke.mp4)) { throw "Encoding a test clip failed" }
          "Encoded {0:N0} bytes with libx264 and a drawtext overlay." -f (Get-Item smoke.mp4).Length
          Remove-Item smoke.mp4

      - name: Show package contents
        working-directory: src-windows
        shell: pwsh
        run: |
          Get-ChildItem publish -Recurse -File |
            Select-Object @{N='Path';E={$_.FullName.Replace("$PWD\publish\", '')}},
                          @{N='MB';E={[math]::Round($_.Length/1MB, 1)}} |
            Sort-Object MB -Descending | Format-Table -AutoSize
          "Total: {0} MB" -f [math]::Round(((Get-ChildItem publish -Recurse -File |
            Measure-Object Length -Sum).Sum / 1MB), 1)

      # The directory is uploaded, not a zip of it: upload-artifact always zips
      # what it is given, so handing it an archive produced a zip inside a zip.
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: crt-windows
          path: src-windows/publish/

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: crt-windows
          path: crt-windows

      # Release assets are attached as-is, so this is where the archive belongs
      # — one zip holding the exe and its tools folder.
      - name: Archive for release
        run: |
          cd crt-windows
          zip -r ../crt-windows.zip .

      - name: Create/update draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: crt-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
