name: Build and Release

on:
  push:
    branches: [main, "feat/macos-swiftui"]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show toolchain
        run: swift --version

      - name: Build
        working-directory: src-macos
        run: swift build -c release

      - name: Test
        working-directory: src-macos
        run: swift test

      # Assembles build/CRT.app (Info.plist, AppIcon.icns from Resources/icon.ico,
      # ad-hoc signature). Icon generation and signing are best effort.
      - name: Bundle CRT.app
        working-directory: src-macos
        run: bash Scripts/make-app.sh

      - name: Package .dmg
        working-directory: src-macos
        run: hdiutil create -volname CRT -srcfolder build/CRT.app -ov -format UDZO crt-macos.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: crt-macos
          path: src-macos/crt-macos.dmg
          compression-level: 0

  release:
    needs: [build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create/update draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
