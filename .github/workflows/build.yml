name: Build and Release

on:
  push:
    branches: [main, "feat/windows-winui3"]
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      # No -p:Platform here: the solution maps "Any CPU" to x64 for the app
      # project, and passing an explicit platform fails with MSB4126 because
      # there is no x64 *solution* configuration.
      - name: Build
        working-directory: src-windows
        run: dotnet build CRT.sln -c Release

      - name: Test
        working-directory: src-windows
        run: dotnet test CRT.Core.Tests/CRT.Core.Tests.csproj -c Release --no-build

      # Self-contained so the Windows App SDK runtime ships with the app and
      # users don't need to install anything.
      - name: Publish
        working-directory: src-windows
        run: dotnet publish CRT/CRT.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Package
        working-directory: src-windows
        run: Compress-Archive -Path publish/* -DestinationPath crt-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: crt-windows
          path: src-windows/crt-windows.zip
          compression-level: 0

  release:
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Create/update draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
